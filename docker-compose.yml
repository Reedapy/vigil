# ─── Vigil — Production Docker Compose ────────────────────────────────────────
#
# Services:
#   postgres   — time-series metrics store
#   api        — Node.js ingestion + REST + WebSocket server
#   dashboard  — Next.js monitoring UI
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vigil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is auto-applied on first start
      - ./api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Host port is remappable — 5432 is often taken by another local Postgres.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vigil-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_SECRET: ${API_SECRET}
      API_PORT: ${API_PORT:-4000}
      NODE_ENV: production
      # Optional SMTP for email alerts — leave blank to log emails instead of sending
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Dashboard ────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: vigil-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      # Internal URL used by server-side rendering to reach the API container
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
      NODE_ENV: production

  # ── Vigil Agent ───────────────────────────────────────────────────────────────
  # Opt-in only: `docker compose --profile agent up`. By default the agent runs
  # NATIVELY on each monitored host (see README) — a containerised agent reports
  # the container's metrics, not the host's, and re-registers on every restart.
  agent:
    profiles: ["agent"]
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: vigil-agent
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VIGIL_SERVER_NAME: ${VIGIL_SERVER_NAME}
      VIGIL_API_URL: ${VIGIL_API_URL}
      VIGIL_AGENT_KEY: ${VIGIL_AGENT_KEY}
      VIGIL_INTERVAL: ${VIGIL_INTERVAL}
      # VIGIL_API_SECRET: ${API_SECRET}


volumes:
  postgres_data:
    driver: local


